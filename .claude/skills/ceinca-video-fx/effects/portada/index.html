<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=1080, height=1920">
<title>portada</title>
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="shared/base.css">
<style>
  .deco-ring { position:absolute; right:-260px; bottom:-120px; width:820px; height:820px; border-radius:50%; border:3px solid var(--fx-accent); opacity:.35 }
  .deco-disc { position:absolute; right:-120px; bottom:60px; width:420px; height:420px; border-radius:50%; background:var(--fx-grad-accent); opacity:.9 }
  .stack { position:absolute; left:0; right:0; top:50%; transform:translateY(-52%); }
  .kicker { display:inline-block; padding:16px 36px; border-radius:999px; background:var(--fx-accent); color:var(--fx-on-accent); font-family:var(--fx-font-display); font-weight:var(--fx-fw-display); font-size:36px; letter-spacing:.14em; text-transform:uppercase; }
  .titular { margin:48px 0 0; font-family:var(--fx-font-display); font-weight:var(--fx-fw-display); line-height:1.02; letter-spacing:-.035em; text-transform:uppercase; color:var(--fx-text); }
  .mask { display:inline-block; overflow:hidden; vertical-align:top; padding:0 .12em .14em 0; margin-bottom:-.14em; }
  .mask .w { display:inline-block; }
  .bar { height:14px; width:260px; background:var(--fx-grad-accent); border-radius:999px; margin-top:44px; transform-origin:left center; }
  .sub { margin-top:36px; font-size:46px; line-height:1.3; font-weight:var(--fx-fw-strong); color:var(--fx-text-muted); max-width:820px; }
</style></head>
<body>
<div id="root" data-composition-id="root" data-start="0" data-duration="4" data-width="1080" data-height="1920">
  <div class="deco-ring"></div><div class="deco-disc"></div>
  <div id="area" class="fx-area"><div class="stack">
    <span class="kicker" id="kicker"></span>
    <h1 class="titular" id="titular"></h1>
    <div class="bar" id="bar"></div>
    <div class="sub" id="sub"></div>
  </div></div>
</div>
<script src="vendor/gsap/gsap.min.js"></script><script src="params.js"></script><script src="shared/fx.js"></script>
<script>
const ctx = FX.init({ kicker: 'ALERTA MERCANTIL', titular: 'Tu empresa **sin** sorpresas', subtitulo: 'Lo que cambia este año' });
const { P, tl, D } = ctx;
document.getElementById('kicker').textContent = P.kicker;
const sub = document.getElementById('sub'); FX.setRich(sub, P.subtitulo);
const h = document.getElementById('titular');
const len = String(P.titular).replace(/\*\*/g, '').length;
h.style.fontSize = (len <= 18 ? 168 : len <= 32 ? 132 : len <= 52 ? 104 : 84) + 'px';
String(P.titular).split('**').forEach((seg, i) => {
  seg.split(/\s+/).filter(Boolean).forEach((word) => {
    const m = FX.el('span', 'mask', h); const w = FX.el('span', 'w' + (i % 2 ? ' fx-hl' : ''), m, word); h.appendChild(document.createTextNode(' '));
  });
});
tl.from('#kicker', { y: -40, opacity: 0, duration: 0.5, ease: 'power3.out' }, 0.1);
tl.from('.titular .w', { yPercent: 115, duration: 0.8, ease: 'power4.out', stagger: 0.09 }, 0.35);
tl.from('#bar', { scaleX: 0, duration: 0.7, ease: 'power3.inOut' }, 1.0);
tl.from('#sub', { y: 30, opacity: 0, duration: 0.6, ease: 'power2.out' }, 1.2);
tl.from('.deco-disc', { scale: 0.6, opacity: 0, duration: 1.2, ease: 'power3.out' }, 0);
tl.from('.deco-ring', { scale: 0.85, opacity: 0, duration: 1.4, ease: 'power3.out' }, 0);
window.__timelines = window.__timelines || {}; window.__timelines['root'] = FX.finish(ctx);
</script></body></html>
