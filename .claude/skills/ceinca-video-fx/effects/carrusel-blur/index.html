<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=1080, height=1920">
<title>carrusel-blur</title>
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="shared/base.css">
<style>
  .titulo { font-family:var(--fx-font-display); font-weight:var(--fx-fw-display); font-size:74px; line-height:1.05; letter-spacing:-.02em; text-transform:uppercase; margin:0 0 24px 0; }
  .viewport { position:relative; width:100%; height:750px; overflow:hidden; display:flex; align-items:center; }
  #root[data-formato="horizontal"] .viewport { height:520px; }
  .track { display:flex; gap:36px; position:absolute; left:0; will-change:transform,filter; }
  .c-card { width:460px; height:580px; background:var(--fx-surface); border:2px solid var(--fx-line); border-radius:var(--fx-radius-lg); padding:36px; display:flex; flex-direction:column; justify-content:space-between; flex:none; box-shadow:var(--fx-shadow-card); position:relative; overflow:hidden; }
  #root[data-formato="horizontal"] .c-card { width:380px; height:440px; padding:28px; }
  .c-card.selected { border-color:var(--fx-accent); box-shadow:var(--fx-shadow-accent); }
  .c-top { display:flex; align-items:center; justify-content:space-between; }
  .c-tag { font-family:var(--fx-font-mono); font-size:22px; text-transform:uppercase; letter-spacing:.05em; color:var(--fx-text-muted); background:var(--fx-surface-2); padding:6px 16px; border-radius:999px; }
  .c-check { width:52px; height:52px; border-radius:50%; background:var(--fx-accent); color:var(--fx-on-accent); display:flex; align-items:center; justify-content:center; transform:scale(0); }
  .c-check svg { width:28px; height:28px; }
  .c-title { font-family:var(--fx-font-display); font-weight:var(--fx-fw-display); font-size:62px; line-height:1.05; color:var(--fx-text); margin-top:20px; }
  #root[data-formato="horizontal"] .c-title { font-size:48px; }
  .c-desc { font-family:var(--fx-font-body); font-size:30px; color:var(--fx-text-muted); margin-top:10px; }
  .c-bottom { font-family:var(--fx-font-mono); font-size:24px; color:var(--fx-accent); }
</style></head>
<body>
<svg style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <filter id="c-motion-blur"><feGaussianBlur id="blur-node" stdDeviation="18,0"></feGaussianBlur></filter>
  </defs>
</svg>
<div id="root" data-composition-id="root" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
  <div id="area" class="fx-area" style="display:flex;flex-direction:column;justify-content:center">
    <h1 class="titulo" id="titulo"></h1>
    <div class="viewport" id="viewport">
      <div class="track" id="track" style="filter:url(#c-motion-blur)"></div>
    </div>
  </div>
</div>
<script src="vendor/gsap/gsap.min.js"></script><script src="params.js"></script><script src="shared/fx.js"></script>
<script>
const ctx = FX.init({
  duracion: 4.5,
  titulo: 'Selección de **modelo**',
  tarjetas: [
    { titulo: 'Haiku 4.5', subtitulo: 'Velocidad extrema', tag: '0.4s' },
    { titulo: 'Sonnet 4.6', subtitulo: 'Producción y código', tag: 'Recomendado' },
    { titulo: 'Opus 4.5', subtitulo: 'Razonamiento complejo', tag: 'Pro' },
    { titulo: 'Veo 3.1', subtitulo: 'Video cinematográfico', tag: 'Media' }
  ],
  destacado: 1
});
FX.orbe(ctx);
const { P, tl, D, formato } = ctx;
FX.setRich(document.getElementById('titulo'), P.titulo);

const track = document.getElementById('track');
const vp = document.getElementById('viewport');
const blurNode = document.getElementById('blur-node');

const items = P.tarjetas || [
  { titulo: 'Opción 1', subtitulo: 'Detalle 1', tag: 'A' },
  { titulo: 'Opción 2', subtitulo: 'Detalle 2', tag: 'B' }
];
const destIdx = Math.max(0, Math.min(items.length - 1, Number(P.destacado ?? 1)));

const cardEls = items.map((it, idx) => {
  const c = document.createElement('div');
  c.className = 'c-card';
  c.id = 'card-' + idx;

  const top = document.createElement('div');
  top.className = 'c-top';
  const tag = document.createElement('div');
  tag.className = 'c-tag';
  tag.textContent = it.tag || ('0' + (idx + 1));
  const chk = document.createElement('div');
  chk.className = 'c-check';
  chk.id = 'chk-' + idx;
  chk.appendChild(FX.icon('check'));
  top.appendChild(tag);
  top.appendChild(chk);

  const mid = document.createElement('div');
  const t = document.createElement('div');
  t.className = 'c-title';
  t.textContent = it.titulo;
  const d = document.createElement('div');
  d.className = 'c-desc';
  d.textContent = it.subtitulo || '';
  mid.appendChild(t);
  mid.appendChild(d);

  const btm = document.createElement('div');
  btm.className = 'c-bottom';
  btm.textContent = idx === destIdx ? '★ SELECCIONADO' : '';

  c.appendChild(top);
  c.appendChild(mid);
  c.appendChild(btm);
  track.appendChild(c);
  return c;
});

// Dimensiones
const isHoriz = formato === 'horizontal';
const cardW = isHoriz ? 380 : 460;
const gap = 36;
const vpW = vp.clientWidth || (isHoriz ? 1720 : 960);
const targetX = (vpW / 2) - (destIdx * (cardW + gap) + cardW / 2);
const startX = targetX + 1800;

gsap.set(track, { x: startX });

// Animación GSAP
tl.from('#titulo', { y: 30, opacity: 0, duration: 0.45, ease: 'power3.out' }, 0);

// 1. Barrido de alta velocidad y frenado en seco
tl.to(track, {
  x: targetX,
  duration: 1.8,
  ease: 'power4.out'
}, 0.4);

// 2. Desenfoque que desaparece al frenar
FX.drive(tl, 18, 0, { duration: 1.8, ease: 'power4.out' }, (val) => {
  const v = Math.max(0, val);
  blurNode.setAttribute('stdDeviation', v.toFixed(1) + ',0');
  if (v < 0.1) track.style.filter = 'none';
}, 0.4);

// 3. Resaltado de tarjeta ganadora al frenar
const winCard = cardEls[destIdx];
const winChk = document.getElementById('chk-' + destIdx);

tl.to(winCard, {
  scale: 1.06,
  className: 'c-card selected',
  duration: 0.4,
  ease: 'back.out(2)'
}, 2.1);

tl.to(winChk, {
  scale: 1,
  duration: 0.35,
  ease: 'back.out(2.5)'
}, 2.25);

// 4. Atenuar las otras tarjetas
cardEls.forEach((c, i) => {
  if (i !== destIdx) {
    tl.to(c, { opacity: 0.42, duration: 0.4 }, 2.1);
  }
});

window.__timelines = window.__timelines || {}; window.__timelines['root'] = FX.finish(ctx);
</script></body></html>
