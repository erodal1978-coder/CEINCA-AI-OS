<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=1080, height=1920">
<title>corta-pega</title>
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="shared/base.css">
<style>
  .wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  /* Cuadrícula de papel de fondo */
  .grid-bg { position:absolute; inset:0; background-size:60px 60px; background-image:linear-gradient(to right, rgba(var(--fx-line-rgb),.2) 1px, transparent 1px), linear-gradient(to bottom, rgba(var(--fx-line-rgb),.2) 1px, transparent 1px); }
  .stage { position:relative; width:920px; height:1200px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  /* Sujeto con borde sticker */
  .sticker-wrap { position:relative; max-width:820px; max-height:860px; display:flex; align-items:center; justify-content:center; z-index:5; }
  .sticker-img { max-width:100%; max-height:100%; object-fit:contain; filter:drop-shadow(6px 0 0 var(--fx-text)) drop-shadow(-6px 0 0 var(--fx-text)) drop-shadow(0 6px 0 var(--fx-text)) drop-shadow(0 -6px 0 var(--fx-text)) drop-shadow(0 25px 40px rgba(var(--fx-bg-rgb),.75)); }
  /* Tiras de cinta adhesiva decorativas */
  .tape { position:absolute; width:160px; height:44px; background:rgba(var(--fx-accent-rgb),.35); border:1px dashed var(--fx-accent); transform:rotate(-8deg); z-index:10; }
  /* Etiquetas y titular recortados */
  .labels-row { position:relative; display:flex; gap:16px; margin-bottom:24px; z-index:8; }
  .tag { font-family:var(--fx-font-display); font-weight:var(--fx-fw-display); font-size:24px; letter-spacing:.06em; text-transform:uppercase; color:var(--fx-on-accent); background:var(--fx-accent); padding:8px 24px; border-radius:4px; box-shadow:0 8px 20px rgba(var(--fx-bg-rgb),.4); transform:rotate(-2deg); }
  .paper-strip { position:relative; background:var(--fx-surface); border:2px dashed var(--fx-accent); padding:24px 40px; border-radius:8px; box-shadow:0 15px 35px rgba(var(--fx-bg-rgb),.6); margin-top:30px; text-align:center; z-index:8; transform:rotate(1deg); }
  .titular { font-family:var(--fx-font-display); font-weight:var(--fx-fw-display); font-size:56px; line-height:1.1; letter-spacing:-.02em; color:var(--fx-text); }
  .subtitulo { font-family:var(--fx-font-body); font-weight:var(--fx-fw-body); font-size:28px; color:var(--fx-text-muted); margin-top:8px; }
  .fx-area { background:none; }
</style></head>
<body>
<div id="root" data-composition-id="root" data-start="0" data-duration="4" data-width="1080" data-height="1920">
  <div class="fx-bgfill"></div>
  <div class="grid-bg"></div>
  <div id="area" class="fx-area fx-free wrap">
    <div class="stage" id="stage">
      <div class="tape" style="top:40px; left:120px;"></div>
      <div class="labels-row" id="tags"></div>
      <div class="sticker-wrap" id="stickerWrap"></div>
      <div class="paper-strip" id="paperStrip">
        <div class="titular" id="titular"></div>
        <div class="subtitulo" id="subtitulo"></div>
      </div>
    </div>
  </div>
</div>
<script src="vendor/gsap/gsap.min.js"></script><script src="params.js"></script><script src="shared/fx.js"></script>
<script>
const ctx = FX.init({
  sujeto: null,
  titular: 'CORTA Y **PEGA**',
  subtitulo: 'Estilo collage y stop-motion',
  etiquetas: ['100% CÓDIGO', 'REEL VIRAL']
});
const { P, tl, D } = ctx;

const tit = document.getElementById('titular');
FX.setRich(tit, P.titular);

const sub = document.getElementById('subtitulo');
sub.textContent = P.subtitulo || '';

const tagsBox = document.getElementById('tags');
const tagsList = Array.isArray(P.etiquetas) ? P.etiquetas : ['CEINCA™'];
tagsList.forEach((t, i) => {
  const el = FX.el('div', 'tag', tagsBox, t);
  if (i % 2 === 1) el.style.transform = 'rotate(3deg)';
});

const sw = document.getElementById('stickerWrap');
if (P.sujeto && FX.isMedia(P.sujeto)) {
  const im = FX.el('img', 'sticker-img', sw);
  im.src = P.sujeto;
}

// Animación Stop-Motion (saltos discretos cada 0.3s):
// Entrada brusca con snap
tl.from('#stickerWrap', { scale: 0, rotation: -15, duration: 0.35, ease: 'back.out(2)' }, 0.2);
tl.from('#paperStrip', { y: 60, opacity: 0, rotation: 8, duration: 0.3, ease: 'power2.out' }, 0.4);
tl.from('#tags .tag', { scale: 0, stagger: 0.12, duration: 0.25, ease: 'back.out(1.8)' }, 0.55);

// Movimiento discontinuo estilo recorte papel (steps)
const steps = [
  { rot: 2, x: 8, y: -4, time: 0.8 },
  { rot: -3, x: -6, y: 5, time: 1.3 },
  { rot: 1, x: 4, y: -2, time: 1.8 },
  { rot: -2, x: -5, y: 3, time: 2.3 },
  { rot: 3, x: 6, y: -4, time: 2.8 },
  { rot: -1, x: -3, y: 2, time: 3.3 }
];

steps.forEach(st => {
  if (st.time < D) {
    tl.to('#stickerWrap', { rotation: st.rot, x: st.x, y: st.y, duration: 0.08, ease: 'none' }, st.time);
    tl.to('#paperStrip', { rotation: -st.rot * 0.7, duration: 0.08, ease: 'none' }, st.time);
  }
});

window.__timelines = window.__timelines || {};
window.__timelines['root'] = FX.finish(ctx);
</script></body></html>
