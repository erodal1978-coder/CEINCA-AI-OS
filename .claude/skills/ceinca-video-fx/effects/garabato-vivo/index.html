<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=1080, height=1920">
<title>garabato-vivo</title>
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="shared/base.css">
<style>  .base { position:absolute; left:0; top:0; width:960px; height:960px; border-radius:var(--fx-radius-lg); overflow:hidden; box-shadow:var(--fx-shadow-card); background:var(--fx-surface); display:flex; align-items:center; justify-content:center; }
  .base img { width:100%; height:100%; object-fit:cover; display:block; }
  .base .bt { padding:60px; text-align:center; font-family:var(--fx-font-display); font-weight:var(--fx-fw-display); font-size:120px; line-height:1.05; letter-spacing:-.03em; text-transform:uppercase; }
  svg.sc { position:absolute; left:0; top:0; width:960px; height:960px; overflow:visible; }
  svg.sc path { fill:none; stroke-width:14; stroke-linecap:round; stroke-linejoin:round; }
</style></head>
<body>
<div id="root" data-composition-id="root" data-start="0" data-duration="4" data-width="1080" data-height="1920">
<div id="area" class="fx-area fx-free" style="overflow:visible"><div class="base" id="base"></div><svg class="sc" id="sc" viewBox="0 0 960 960"></svg></div>
</div>
<script src="vendor/gsap/gsap.min.js"></script><script src="params.js"></script><script src="shared/fx.js"></script>
<script>
const ctx = FX.init({ base: null, texto: 'Aquí está el **error**', trazos: [
  { tipo: 'circulo', x: 50, y: 25, w: 30, h: 16, color: 'accent' }, { tipo: 'flecha', x: 76, y: 62, w: -22, h: -26, color: 'accent' }, { tipo: 'subrayado', x: 8, y: 60, w: 58, color: 'danger' } ] });
const { P, tl, D, rng } = ctx;
const SIZE = 960;
const base = document.getElementById('base');
if (P.base && FX.isImg(P.base)) { const im = FX.el('img', '', base); im.src = P.base; } else FX.setRich(FX.el('div', 'bt', base), P.base || P.texto);
const NS = 'http://www.w3.org/2000/svg'; const svg = document.getElementById('sc');
const px = (v) => (v / 100) * SIZE;
const col = { accent: 'var(--fx-accent)', text: 'var(--fx-text)', danger: 'var(--fx-danger)', ok: 'var(--fx-ok)', accent2: 'var(--fx-accent-2)' };
const j = (a) => (rng() - 0.5) * a;   // temblor de mano alzada con semilla (determinista)
const f = (n) => n.toFixed(1);
function geo(t) {
  const x = px(t.x), y = px(t.y), w = px(t.w ?? 20), h = px(t.h ?? 10);
  if (t.tipo === 'circulo') {            // elipse con dos pasadas que no cierran en el mismo punto
    const rx = Math.abs(w) / 2, ry = Math.abs(h) / 2; let d = ''; const steps = 36; const turns = 1.12; const a0 = -2.2;
    for (let i = 0; i <= steps; i++) { const a = a0 + (Math.PI * 2 * turns * i) / steps; const k = 1 + 0.06 * (i / steps) + j(0.035);
      d += (i ? 'L' : 'M') + f(x + Math.cos(a) * rx * k) + ' ' + f(y + Math.sin(a) * ry * k); }
    return [d];
  }
  if (t.tipo === 'subrayado') {          // línea ondulada
    let d = 'M' + f(x) + ' ' + f(y); const seg = 8; for (let i = 1; i <= seg; i++) d += 'L' + f(x + (w * i) / seg + j(6)) + ' ' + f(y + (i % 2 ? 8 : -8) + j(6)); return [d];
  }
  if (t.tipo === 'tachado') {            // zigzag diagonal
    let d = 'M' + f(x) + ' ' + f(y); for (let i = 1; i <= 6; i++) d += 'L' + f(x + (w * i) / 6 + j(8)) + ' ' + f(y + (i % 2 ? h : 0) + j(8)); return [d];
  }
  // flecha: curva desde (x,y) hasta (x+w, y+h) + cabeza
  const ex = x + w, ey = y + h, mx = (x + ex) / 2 + j(30) - h * 0.18, my = (y + ey) / 2 + j(30) + w * 0.18;
  const ang = Math.atan2(ey - my, ex - mx), hl = 52;
  return [`M${f(x)} ${f(y)}Q${f(mx)} ${f(my)} ${f(ex)} ${f(ey)}`, `M${f(ex + Math.cos(ang + 2.6) * hl)} ${f(ey + Math.sin(ang + 2.6) * hl)}L${f(ex)} ${f(ey)}L${f(ex + Math.cos(ang - 2.6) * hl)} ${f(ey + Math.sin(ang - 2.6) * hl)}`];
}
// hervor (opcional): el trazo "hierve" como animación a mano — la semilla del filtro cambia cada 3 cuadros (10 veces/seg).
if (P.hervor) {
  const defs = document.createElementNS(NS, 'defs');
  const flt = document.createElementNS(NS, 'filter'); flt.setAttribute('id', 'hervor'); flt.setAttribute('x', '-5%'); flt.setAttribute('y', '-5%'); flt.setAttribute('width', '110%'); flt.setAttribute('height', '110%');
  const tur = document.createElementNS(NS, 'feTurbulence'); tur.setAttribute('type', 'fractalNoise'); tur.setAttribute('baseFrequency', '0.035'); tur.setAttribute('numOctaves', '2'); tur.setAttribute('seed', '1'); tur.setAttribute('result', 'n');
  const dsp = document.createElementNS(NS, 'feDisplacementMap'); dsp.setAttribute('in', 'SourceGraphic'); dsp.setAttribute('in2', 'n'); dsp.setAttribute('scale', '9'); dsp.setAttribute('xChannelSelector', 'R'); dsp.setAttribute('yChannelSelector', 'G');
  flt.append(tur, dsp); defs.appendChild(flt); svg.insertBefore(defs, svg.firstChild); svg.style.filter = 'url(#hervor)';
  FX.drive(tl, 0, 1, { duration: D, ease: 'none' }, (v) => { tur.setAttribute('seed', String(1 + Math.floor(v * D * 10))); }, 0);
}
const n = P.trazos.length, span = (D - 1.0) / Math.max(1, n);
P.trazos.forEach((t, i) => {
  const at = t.inicio ?? 0.5 + i * span, dur = t.duracion ?? Math.min(0.9, span * 0.9);
  geo(t).forEach((d, k, arr) => {
    const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.style.stroke = col[t.color || 'accent'] || col.accent; svg.appendChild(p);
    FX.drawable(p);
    const part = arr.length > 1 ? (k ? 0.25 : 0.75) : 1;
    tl.to(p, { strokeDashoffset: 0, duration: dur * part, ease: 'power2.inOut' }, at + (k ? dur * 0.75 : 0));
  });
});
tl.from('#base', { scale: 0.94, opacity: 0, duration: 0.6, ease: 'power3.out' }, 0);

window.__timelines = window.__timelines || {}; window.__timelines['root'] = FX.finish(ctx);
</script></body></html>
